[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ssm-lab"
version = "0.1.0"
description = "From-scratch comparative study of 14+ state-space / linear-recurrent sequence architectures (S4 -> Mamba-3), trained on free Kaggle/Colab GPUs."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]
